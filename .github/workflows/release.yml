name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2-)
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d= -f2-)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
          # 0_ 前缀确保在 Assets 列表中排最顶部（在 Source code 前面）
          echo "zip_name=0_HMAPLUS-Fixed-${VERSION}-模块包.zip" >> $GITHUB_OUTPUT

      - name: Build module ZIP
        run: |
          mkdir -p dist
          # 在当前目录打包，文件直接在ZIP根目录（无外层文件夹），确保Magisk/KernelSU可直接刷入
          zip -r "dist/${{ steps.version.outputs.zip_name }}" . \
            -x '*.git*' \
            -x '*.github*' \
            -x 'dist/*' \
            -x '*.DS_Store'
          echo "✅ 打包完成: ${{ steps.version.outputs.zip_name }}"
          echo "📦 ZIP内容结构："
          unzip -l "dist/${{ steps.version.outputs.zip_name }}"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            <div align="center">

            # HMAPLUS-Fixed ${{ steps.version.outputs.version }}

            ### ⬇️ 点击下方按钮下载模块包

            [![下载模块包](https://img.shields.io/badge/📥_下载模块安装包-2ea44f?style=for-the-badge)](https://github.com/Mr-Du12/HMAPLUS-Fixed/releases/download/${{ github.ref_name }}/${{ steps.version.outputs.zip_name }})

            </div>

            ---

            ## ⚠️ 重要提醒

            | ✅ 正确下载 | ❌ 不要下载 |
            |-----------|-----------|
            | **Assets 中的 `0_HMAPLUS-Fixed-${{ steps.version.outputs.version }}-模块包.zip`** | Source code (zip) |
            | 可以直接刷入 Magisk/KernelSU/SukiSU | 是源代码，解压后多一层文件夹，无法刷入 |

            ---

            ## 📲 安装说明

            1. 点击上方绿色按钮下载模块 ZIP 包
            2. 在 Magisk / KernelSU / SukiSU 管理器中选择「从本地安装」
            3. 选择下载的 ZIP 包刷入
            4. 重启设备生效

            ---

            ## ✨ 更新内容

      - name: Update update.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.version.outputs.zip_name }}"
          cat > update.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "versionCode": ${{ steps.version.outputs.versionCode }},
            "zipUrl": "$DOWNLOAD_URL",
            "changelog": "版本 ${{ steps.version.outputs.version }}"
          }
          EOF
          cat update.json

          # 使用 GitHub API 更新 update.json 到 main 分支
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add update.json
          git commit -m "chore: 更新 update.json 到 ${{ steps.version.outputs.version }}" || echo "无变化"
          git push origin main
