name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2-)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=HMAPLUS-Fixed-$VERSION" >> $GITHUB_OUTPUT

      - name: Build module ZIP
        run: |
          mkdir -p dist
          zip -r "dist/${{ steps.version.outputs.name }}.zip" . \
            -x '*.git*' \
            -x '*.github*' \
            -x 'dist/*' \
            -x '*.DS_Store'
          echo "✅ 打包完成: ${{ steps.version.outputs.name }}.zip"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## HMAPLUS-Fixed 模块更新

            **版本**: ${{ steps.version.outputs.version }}

            ### 安装说明
            1. 下载下方 ZIP 包
            2. 在 Magisk / KernelSU / SukiSU 管理器中刷入
            3. 重启设备生效

            ### 更新内容
            - 详见 Commit 记录
